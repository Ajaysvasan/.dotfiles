# ============================================
# tmux.conf — works on both the Mac and the Linux box
# ============================================
#
# Version floor: written and checked against tmux 3.7c; everything
# here works back to roughly tmux 3.1 (needed for the mouse-drag copy
# binding's `copy-pipe-no-clear`, added ~3.0). The default-terminal /
# terminal-features if-shell blocks below already degrade gracefully
# on anything older still — a config line tmux doesn't understand
# prints one startup error but doesn't stop the rest of the file from
# loading, so worst case on a very old tmux is one missing feature,
# not a broken config.
#
# WHY THE OLD ONE LOOKED "NOT SOURCED" ON MACOS
#
# 1. `set -g default-terminal "tmux-256color"`
#    macOS ships ncurses 5.7 (from 2008). Its terminfo database has NO
#    tmux-256color entry. tmux hits that line, fails, and depending on
#    version either aborts the rest of the file or starts with a broken
#    terminal. Either way the theme, keybinds, and everything after it
#    look like they were never applied. Your Linux box has ncurses 6.x,
#    which does have the entry — hence "works there, not here."
#
# 2. `set -ag terminal-overrides ",xterm-256color:RGB"`
#    That override only matches when the OUTER terminal's TERM is exactly
#    xterm-256color. Ghostty sets TERM=xterm-ghostty. Kitty sets
#    xterm-kitty. So on your new terminal the pattern never matched and
#    you got 256-color approximations instead of true colour — which
#    makes catppuccin inside nvim look washed out and subtly wrong.
#
# 3. `bind r source-file ~/.tmux.conf`
#    Hardcoded. If this file lives at ~/.config/tmux/tmux.conf, prefix+r
#    reloads a file that doesn't exist and reports success anyway.
#
# 4. tmux reads its config ONCE, at server start. Editing the file and
#    opening a new window does nothing. See the notes at the bottom.

# ============================================
# General Settings
# ============================================

# Use tmux-256color only if the terminfo entry actually exists.
# Falls back to screen-256color, which macOS does ship. See bottom of
# file for how to install the real entry and get italics back.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# True colour for ANY outer terminal, not just xterm-256color.
# terminal-features is the modern form (tmux 3.2+); the override line is
# kept for older tmux. Both are harmless together.
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",*256col*:RGB,*:Tc"

# Undercurl + coloured underlines, so nvim's LSP diagnostics render as
# squiggles inside tmux instead of flat underlines.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 10000

# --- Neovim-specific, all three matter ---

# Esc delay. Default is 500ms, which is why Esc feels laggy in nvim
# inside tmux but instant outside it.
set -sg escape-time 10

# Lets nvim see focus gain/loss: :checktime autoread, gitsigns refresh,
# and the "file changed on disk" prompt all depend on this.
set -g focus-events on

# Don't start a login shell. macOS runs /usr/libexec/path_helper for
# login shells, which REORDERS $PATH and pushes /usr/bin ahead of
# Homebrew. That's how you end up with a different nvim or a different
# clipboard binary inside tmux than outside it.
set -g default-command "${SHELL}"

# ============================================
# Key Bindings
# ============================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config — resolves its own path instead of assuming ~/.tmux.conf
bind r source-file "#{config_files}" \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window opens in the current path too (was missing)
bind c new-window -c "#{pane_current_path}"

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================
# Theme
# ============================================
# current-theme.conf is a symlink into themes/, repointed by
# `theme vscode` / `theme intellij` / `theme toggle`
# (~/.config/theme-switcher/switch-theme.sh). Edit themes/*.conf
# directly to tweak a palette; don't edit current-theme.conf itself,
# it gets overwritten on every switch.
# (No -q flag: that needs tmux 3.2+. The symlink always exists once
# switch-theme.sh has run once, and on tmux this old a missing file
# just prints one harmless startup error instead of aborting the rest
# of the config.)
# Full docs + CLI reference: ~/.config/theme-switcher/README.md
source-file "~/.config/tmux/current-theme.conf"

# Same switcher kitty's cmd+shift+t uses — keeps both in sync even if
# you trigger it from inside tmux instead.
bind T run-shell "~/.config/theme-switcher/switch-theme.sh toggle"

# ============================================
# Copy mode + clipboard
# ============================================
setw -g mode-keys vi

# OSC 52. Lets tmux forward copies to the system clipboard through the
# terminal itself — this is what makes yanking work over SSH too.
set -g set-clipboard on

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# `y` piped to the real system clipboard, not just tmux's internal
# buffer. The old copy-selection-and-cancel only filled tmux's buffer,
# so Cmd+V outside tmux pasted whatever was there before.
if-shell 'uname | grep -q Darwin' \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"

# Mouse drag: copy to system clipboard without exiting copy mode.
# You had this unbound entirely, which meant mouse selections copied
# nowhere.
unbind -T copy-mode-vi MouseDragEnd1Pane
if-shell 'uname | grep -q Darwin' \
  "bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear 'pbcopy'" \
  "bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear 'xclip -selection clipboard -in'"

# ============================================
# NOTES
# ============================================
#
# tmux only reads this file when the SERVER starts. Reloading properly:
#   prefix + r          (uses the binding above)
#   tmux source-file ~/.config/tmux/tmux.conf     # prints real errors
#   tmux kill-server                              # nuclear, always works
#
# Verify what tmux actually loaded:
#   tmux display-message -p '#{config_files}'
#
# Getting real tmux-256color on macOS (optional — enables italics):
#   brew install ncurses
#   /opt/homebrew/opt/ncurses/bin/infocmp -x tmux-256color > /tmp/tmux-256color.src
#   # ncurses 5.7 misreads pairs#65536 as pairs#1, so clamp it:
#   sed -i '' 's/pairs#0x10000/pairs#32767/; s/pairs#65536/pairs#32767/' /tmp/tmux-256color.src
#   /usr/bin/tic -x -o ~/.local/share/terminfo /tmp/tmux-256color.src
#   # then add to ~/.zshrc:
#   #   export TERMINFO_DIRS="$TERMINFO_DIRS:$HOME/.local/share/terminfo"
#   # restart the terminal; the if-shell above picks it up automatically.
#
# Check true colour is reaching nvim, inside tmux:
#   :lua print(vim.o.termguicolors)   -- should be true
#   :checkhealth vim.provider         -- clipboard section
