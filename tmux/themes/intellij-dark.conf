# ============================================
# Theme — IntelliJ IDEA Darcula-inspired
# ============================================
set -g status-style bg=#2b2b2b,fg=#a9b7c6
set -g status-position bottom
set -g status-justify left

set -g status-left-length 40
set -g status-left "#[fg=#4a88c7,bold]  #S #[fg=#3c3f41]│ "

set -g status-right-length 100
set -g status-right "#[fg=#3c3f41]│ #[fg=#cc7832]%H:%M #[fg=#3c3f41]│ #[fg=#6a8759]%d %b %Y "

setw -g window-status-format "#[fg=#808080] #I:#W "
setw -g window-status-current-format "#[fg=#4a88c7,bold] #I:#W "

set -g pane-border-style fg=#3c3f41
set -g pane-active-border-style fg=#4a88c7

set -g message-style bg=#3c3f41,fg=#a9b7c6
setw -g mode-style bg=#214283,fg=#ffffff
setw -g clock-mode-colour "#4a88c7"
