# ============================================
# Theme — VS Code Dark+
# ============================================
set -g status-style bg=#1e1e1e,fg=#d4d4d4
set -g status-position bottom
set -g status-justify left

set -g status-left-length 40
set -g status-left "#[fg=#007acc,bold]  #S #[fg=#454545]│ "

set -g status-right-length 100
set -g status-right "#[fg=#454545]│ #[fg=#c586c0]%H:%M #[fg=#454545]│ #[fg=#6a9955]%d %b %Y "

setw -g window-status-format "#[fg=#808080] #I:#W "
setw -g window-status-current-format "#[fg=#007acc,bold] #I:#W "

set -g pane-border-style fg=#454545
set -g pane-active-border-style fg=#007acc

set -g message-style bg=#252526,fg=#d4d4d4
setw -g mode-style bg=#264f78,fg=#d4d4d4
setw -g clock-mode-colour "#007acc"
