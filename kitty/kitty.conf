# ~/.config/kitty/kitty.conf
#
# Tuned for: macOS + Neovim + tmux. Also fine on Linux — every
# macos_* option below is simply ignored (no error) when kitty isn't
# running on macOS.
#
# Version floor: written and checked against kitty 0.48; everything
# in this file works back to roughly kitty 0.37 (which is when
# cursor_trail was added — see below). Below that, kitty just ignores
# options it doesn't know with a warning rather than failing to start,
# so an even older kitty will still launch, only missing that one
# cosmetic feature.
#
# Colors live in themes/*.conf and are pulled in via current-theme.conf,
# a symlink that `theme` (~/.config/theme-switcher/switch-theme.sh)
# repoints. Run `theme vscode`, `theme intellij`, or `theme toggle` to
# switch — it updates kitty and tmux together and reloads both live.
# Full docs + CLI reference: ~/.config/theme-switcher/README.md
#
# Reload without restarting:  ctrl+cmd+, (kitty's default)
# Check what's actually applied:  kitty +runpy "print(1)" / kitty --debug-config


# ════════════════════════════════════════════════════════════════════
# FONT
# ════════════════════════════════════════════════════════════════════
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 14.0

# macOS renders text noticeably thinner than Linux at the same weight.
# This compensates; drop to 0 if it looks muddy on your display.
macos_thicken_font 0.3

# Ligatures on, except on the line the cursor is on — otherwise editing
# a `!==` in nvim shifts characters around under your cursor.
disable_ligatures cursor

# Kitty has its own Nerd Font symbol fallback built in, so box-drawing
# and icons work even if a font ever goes missing. Leave this alone.
# symbol_map is unnecessary with a full Nerd Font installed.

# Slight negative adjustment keeps powerline/tmux status separators
# flush. Tune if your status bar has gaps.
modify_font underline_position -2
modify_font underline_thickness 1


# ════════════════════════════════════════════════════════════════════
# macOS SPECIFIC  — read this section, two of these matter a lot
# ════════════════════════════════════════════════════════════════════

# CRITICAL for your config. Kitty's default is `no`, which means Option
# behaves like macOS Option and produces ¡™£¢ etc. instead of Alt.
# Your harpoon bindings are <A-1> through <A-5> — they are silently
# doing nothing on the Mac right now because of this.
#
# Trade-off: with `yes`, you lose Option-based special characters
# (é, ñ, #  on some layouts). If you need those, use `left` instead —
# left Option becomes Alt, right Option stays macOS-native.
macos_option_as_alt yes

# tmux keeps your sessions alive, so closing a window costs nothing.
confirm_os_window_close 0
macos_quit_when_last_window_closed yes

# Titlebar matches the background instead of showing a grey macOS bar.
hide_window_decorations titlebar-only
macos_show_window_title_in window

# Native fullscreen creates a separate Space and animates. `no` gives
# you an instant, in-place fullscreen — better with a tiling workflow.
macos_traditional_fullscreen no

# Custom beam cursor can go invisible on dual-GPU Macs; the stock one
# doesn't have that problem.
macos_custom_beam_cursor no


# ════════════════════════════════════════════════════════════════════
# WINDOW
# ════════════════════════════════════════════════════════════════════
window_padding_width 10 12
single_window_margin_width 0
draw_minimal_borders yes
window_border_width 0

# Opacity is off by default because your nvim is NOT transparent — its
# colorscheme sets an explicit background, so nvim would render opaque
# while the shell around it is see-through. That looks worse than either
# extreme.
#
# If you want it, do BOTH of these together:
#   here:              background_opacity 0.92
#                      background_blur 24
#   colorscheme.lua:   transparent_background = true
background_opacity 1.0

remember_window_size  no
initial_window_width  1200
initial_window_height 800

# You have tmux for splits and windows. Kitty's tab bar only appears if
# you actually open a second tab, so it stays out of the way.
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style slanted


# ════════════════════════════════════════════════════════════════════
# CURSOR
# ════════════════════════════════════════════════════════════════════
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# Smooth cursor motion (kitty 0.37+; harmless no-op with a warning on
# older kitty, since kitty ignores config keys it doesn't recognize
# instead of failing to start).
cursor_trail 3
cursor_trail_decay 0.1 0.4


# ════════════════════════════════════════════════════════════════════
# SCROLLBACK / MOUSE
# ════════════════════════════════════════════════════════════════════
scrollback_lines 10000

# Open scrollback in nvim instead of less. Gives you search, yank, and
# your own keybinds over terminal output.
#
# Bug fix: the old command wrote every scrollback buffer to the same
# fixed /tmp/kitty_scrollback path. Two kitty windows opened at once
# would stomp each other's file, and closing one could delete the file
# out from under the other. tempname() gives each invocation its own
# unique path instead.
scrollback_pager nvim -c "set signcolumn=no showtabline=0" -c "let g:kitty_scrollback_file = tempname()" -c "execute 'silent write! ' . g:kitty_scrollback_file" -c "execute 'autocmd VimLeave * call delete(\"' . g:kitty_scrollback_file . '\")'" -c "normal G"

# Off deliberately: you're in tmux copy-mode most of the time, and
# copy_on_select fights with it for the clipboard.
copy_on_select no
strip_trailing_spaces smart

mouse_hide_wait 2.0
url_style curly
detect_urls yes


# ════════════════════════════════════════════════════════════════════
# BEHAVIOUR
# ════════════════════════════════════════════════════════════════════
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no

# Redraw responsiveness. repaint_delay 8 ≈ 120fps ceiling; noticeably
# smoother than the default 10 when scrolling in nvim.
repaint_delay 8
input_delay 1
sync_to_monitor yes

allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# Uncomment to have kitty drop you straight into tmux:
# shell zsh -c "tmux new-session -A -s main"


# ════════════════════════════════════════════════════════════════════
# KEYMAPS
# ════════════════════════════════════════════════════════════════════
# Kitty's macOS defaults already give you cmd+c/v, cmd+t, cmd+w,
# cmd+n, cmd+plus/minus. These are additions, not replacements.

map cmd+enter        toggle_fullscreen
map cmd+shift+r      load_config_file
map cmd+shift+h      show_scrollback

# Toggle between the VS Code Dark and IntelliJ Dark themes below. This
# reloads kitty AND tmux together so they never fall out of sync.
# (No --allow-remote-control needed here: allow_remote_control is
# already yes below, and the script talks to kitty's socket directly.)
map cmd+shift+t      launch --type=background ~/.config/theme-switcher/switch-theme.sh toggle

# Font size on the fly
map cmd+equal        change_font_size all +1.0
map cmd+minus        change_font_size all -1.0
map cmd+0            change_font_size all 0

# Ctrl+Shift+/ is indistinguishable from Ctrl+/ in a normal terminal —
# both collapse to the same byte. This makes kitty send a distinct
# CSI-u sequence so you CAN bind block-comment separately in nvim.
# In nvim:  vim.keymap.set("n", "<C-S-/>", "<Plug>(comment_toggle_blockwise_current)")
map ctrl+shift+slash send_text all \x1b[47;6u


# ════════════════════════════════════════════════════════════════════
# COLORS
# ════════════════════════════════════════════════════════════════════
# current-theme.conf is a symlink into themes/, repointed by
# `theme vscode` / `theme intellij` / `theme toggle`
# (~/.config/theme-switcher/switch-theme.sh). Edit themes/*.conf
# directly to tweak a palette; don't edit current-theme.conf itself,
# it gets overwritten on every switch.
include current-theme.conf
